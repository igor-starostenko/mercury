<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Apply the saved color scheme (mercury.theme) before first paint
     so there is no flash of the default scheme. -->
<script>try { var _t = localStorage.getItem('mercury.theme'); if (_t) document.documentElement.dataset.theme = _t; } catch (e) {}</script>
<link rel="icon" href="/static/img/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/static/img/apple-touch-icon.png" />
<title>Mercury — Transactions</title>
<link rel="stylesheet" href="/static/css/app.css" />
<script src="/static/vendor/chart.umd.min.js"></script>
<script src="/static/js/common.js"></script>
<script src="/static/js/ui.js"></script>
</head>
<body>
<div id="site-header"></div>
<main>
  <div class="page-range" id="page-range"></div>
  <div class="panel" id="emptyHint" style="display:none;margin-bottom:24px">
    <h2 style="margin:0 0 8px;font-size:16px">No transactions yet</h2>
    <p style="color:var(--muted);margin:0">Use <b>Manage Imports</b> in the top bar to load
    your bank exports (Wells Fargo, Chase, Apple Card, US Bank) — and later to rename
    or delete any import. Files are matched by filename — keep the bank's original names.</p>
  </div>

  <section class="section">
    <div class="section-head">
      <h2>Find transactions</h2>
      <span class="badge" id="ovShownCount" aria-live="polite"></span>
      <button class="primary" id="classifyBtn" onclick="runClassify()">Classify unknown (LLM)</button>
      <select id="setBySel" class="setby-sel" aria-label="Filter rows by who set the category">
        <option value="all">All</option>
        <option value="manual">You</option>
        <option value="llm">LLM</option>
        <option value="rule">Rule</option>
        <option value="uncategorized">Unknown</option>
      </select>
      <!-- Rule-builder row, same markup as the Categories page's "Custom
           category rules" form (ui.js renderRules). The keyword input is
           also the description search (same live filtering + chart), and
           "Add rule" saves the typed keyword → category (+ scope) as a
           category rule. Dropdowns + button stay disabled until a keyword
           is typed. -->
      <form class="rule-form" id="txnRuleForm" onsubmit="addTxnRule(event)"
            style="flex:1 1 100%;margin:0">
        <input id="ovSearch" type="text" maxlength="200"
               placeholder="Keyword, e.g. 'walmart'"
               aria-label="Search transactions by description">
        <select id="txnRuleCat" disabled aria-label="Category for the new rule"></select>
        <select id="txnScopeSource" disabled aria-label="Source scope"
                onchange="scopeSourceChanged('txn')"></select>
        <select id="txnScopeAccount" disabled aria-label="Account scope"></select>
        <button type="submit" id="txnAddRuleBtn" disabled>Add rule</button>
        <span class="hint" id="ovHint">click a column to sort</span>
      </form>
      <div class="panel" id="txnChartPanel" style="display:none;flex:1 1 100%">
        <div style="position:relative;height:320px"><canvas id="txnChart"></canvas></div>
      </div>
    </div>
    <!-- id="overrides" on the panel itself (moved off the inner div): the
         panel is the .panel mount, so while empty it gets the
         .panel:empty min-height — the list's space is reserved before the
         fetch lands. The inner div is gone; renderOverrides targets the
         panel directly. -->
    <div class="panel tight" id="overrides"></div>
  </section>
</main>
<div class="toast" id="toast"></div>
<div id="modal-root"></div>

<script>
window.onDataChanged = renderAll;
const OV_SET_BY = { manual: 'you', llm: 'LLM', rule: 'rule', csv: 'bank',
                    unknown: 'unknown', uncategorized: 'pending' };
const OV_LIMIT = 1000;        // browse-view window (no search): top 1000 of the filter
const OV_SEARCH_LIMIT = 100000; // search: pull the FULL matching set — a search that
                                // silently truncates to 1000 hides real rule matches
const OV_BASE_HINT = 'missing CSV category or re-categorized · re-pick a category to make it yours';
/* The Set-by filter, description search and column sort all run on the
 * SERVER over the full history (SQL filter + sort before LIMIT). Browse
 * (no search) shows the top OV_LIMIT rows of the section's base set; with
 * a search term active the search scans EVERY transaction — including
 * rows that only carry the bank's CSV category, which the list doesn't
 * show by default (they render with the "bank" badge) — and the limit
 * jumps to OV_SEARCH_LIMIT so every match is visible. The "X of Y shown"
 * hint below the table is the safety net if a term ever matches more. */
let ovRows = [];
let ovTotal = 0;
let ovPendingTotal = 0;
let ovFilter = 'all';
let ovSearch = '';
let ovSeq = 0;
let ovSearchTimer = null;

function ovQuery() {
  const st = $id('overrides')._sortState || { key: 'date', dir: 'desc' };
  const q = (ovSearch || '').trim();
  const p = new URLSearchParams({
    limit: String(q ? OV_SEARCH_LIMIT : OV_LIMIT),
    include_uncategorized: 'true',
    set_by: ovFilter, sort_by: st.key, sort_dir: st.dir, q: ovSearch,
  });
  return '/api/overrides?' + p.toString();
}
async function loadOverrides() {
  const seq = ++ovSeq;
  let data;
  try {
    data = await api(ovQuery());
  } catch (e) {
    if (seq === ovSeq) toast('Failed to load: ' + e.message, 8000);
    return;
  }
  if (seq !== ovSeq) return; // a newer filter/search/sort click superseded it
  ovRows = data.rows;
  ovTotal = data.total;
  ovPendingTotal = data.uncategorized;
  renderOverrides();
}

/* Monthly bar chart of the rows the search/filter is showing right now —
 * same layout as makeFlowChart's totals view: one label per month, Spend
 * and Income bars side by side. Grouped from the live row set, so it
 * always mirrors the list below; hidden when the search returns nothing. */
function renderTxnChart(rows) {
  const panel = $id('txnChartPanel');
  const canvas = $id('txnChart');
  const existing = Chart.getChart(canvas);
  if (existing) existing.destroy();
  if (!rows.length) {
    panel.style.display = 'none';
    return;
  }
  panel.style.display = '';
  // Month key -> [spend, income] over the shown rows; keys in time order.
  const months = new Map();
  for (const t of rows) {
    const k = (t.date || '').slice(0, 7);
    if (!/^\d{4}-\d{2}$/.test(k)) continue;
    const m = months.get(k) || [0, 0];
    if (t.amount < 0) m[0] += -t.amount;
    else if (t.amount > 0) m[1] += t.amount;
    months.set(k, m);
  }
  const keys = [...months.keys()].sort();
  const r2 = v => Math.round(v * 100) / 100;
  new Chart(canvas, {
    type: 'bar',
    data: {
      labels: keys.map(monthLabel),
      datasets: [
        { label: 'Spend', data: keys.map(k => r2(months.get(k)[0])),
          backgroundColor: withAlpha(cssColor('--spend'), .78),
          hoverBackgroundColor: cssColor('--spend'),
          borderRadius: 4, maxBarThickness: 38 },
        { label: 'Income', data: keys.map(k => r2(months.get(k)[1])),
          backgroundColor: withAlpha(cssColor('--income'), .85),
          hoverBackgroundColor: cssColor('--income'),
          borderRadius: 4, maxBarThickness: 38 },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top', align: 'end',
          labels: { color: cssColor('--muted'), usePointStyle: true, boxWidth: 8, boxHeight: 8 } },
        tooltip: {
          // This vendored build calls filter(item, index, dataPoints,
          // chart) — only item is used here, so the slot order is safe.
          filter: item => Number(item.raw) !== 0,
          callbacks: {
            label: c => ' ' + c.dataset.label + ': ' + fmtMoney(Number(c.raw)),
          },
        },
      },
      scales: {
        x: { ticks: { color: cssColor('--muted'), autoSkip: true,
                      maxTicksLimit: 12, maxRotation: 0 },
             grid: { display: false } },
        y: { beginAtZero: true,
             ticks: { color: cssColor('--muted'), callback: v => fmtAxis(v) },
             grid: { color: cssColor('--grid') } },
      },
    },
  });
}

function renderOverrides() {
  const el = $id('overrides');
  if (!el._sortState) el._sortState = { key: 'date', dir: 'desc' };
  const st = el._sortState;
  const rows = ovRows; // already filtered + sorted by the server
  const q = (ovSearch || '').trim();
  const qre = q ? txnSearchRegex(q) : null;
  renderTxnChart(rows);
  const noLlm = !window.LLM_CONFIGURED;
  $id('classifyBtn').disabled = !ovPendingTotal || noLlm;
  $id('classifyBtn').title = noLlm
    ? 'LLM not configured — set both MERCURY_LLM_ENDPOINT and MERCURY_LLM_MODEL, then restart the server' : '';
  // Shown-count moved to the badge next to the h2; the hint only carries
  // search/sort/LLM context now.
  $id('ovShownCount').textContent = (ovTotal > rows.length
    ? rows.length + ' of ' + ovTotal + ' shown'
    : rows.length + ' shown');
  $id('ovHint').textContent =
    (q ? `for “${q}” · ` : '')
    + 'click a column to sort'
    + ((st.key !== 'date' || st.dir !== 'desc') ? ' · ' + txnSortLabel(st) : '')
    + (noLlm && ovPendingTotal ? ' · LLM not configured, Classify is disabled' : '');
  // The base-set purpose text is no longer shown in the header; keep it as
  // a hover hint on the count line where it applies.
  $id('ovHint').title = (ovFilter === 'all' && !q) ? OV_BASE_HINT : '';
  if (!rows.length) {
    $id('overrides').innerHTML = '<p class="empty">'
      + (q
        ? `No matches for “${esc(q)}”.`
        : (ovTotal
          ? (ovFilter === 'uncategorized' ? 'All transactions categorized. 🎉'
                                          : 'No ' + (OV_SET_BY[ovFilter] || ovFilter) + ' transactions.')
          : 'No categorized or pending transactions yet.'))
      + '</p>';
    return;
  }
  $id('overrides').innerHTML = `
    <table>
      <thead><tr>
        ${txnSortTh('date', 'Date', null, st)}<th>Source</th>${txnSortTh('description', 'Description', null, st)}
        <th>Category</th><th>Set by</th>${txnSortTh('amount', 'Amount', 'num', st)}
      </tr></thead>
      <tbody>${rows.map(t => `
        <tr${t.ignored ? ' class="row-ignored"' : ''}>
          <td>${esc(t.date)}</td>
          <td>${esc(t.source)}</td>
          <td class="desc" title="${esc(t.description)}">${highlightDesc(t.description, qre)}</td>
          <td><select class="cat-select" data-id="${t.id}">${catOptions(t.category)}</select>${
            t.original_category && t.original_category !== 'Uncategorized' && t.original_category !== t.category
              ? `<span class="was-cat">was: ${esc(t.original_category)}</span>` : ''}${ruleNoteHTML(t)}</td>
          <td><span class="badge src-${esc(t.set_by)}">${esc(OV_SET_BY[t.set_by] || t.set_by)}</span></td>
          <td class="num ${t.amount < 0 ? 'neg' : 'pos'}">${fmtMoney(t.amount)}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;
  wireCategorySelects(el);
  el._detailRender = () => loadOverrides();
  wireTxnSort(el);
}

/* "Set by" dropdown: same scope the chip row used to offer — the value
 * IS the server's set_by parameter, so no client-side re-filtering. */
$id('setBySel').addEventListener('change', () => {
  ovFilter = $id('setBySel').value;
  loadOverrides();
});
/* The rule-creation controls (category / source / account dropdowns +
 * "Add rule") only make sense with a keyword in hand, so they stay
 * disabled while the search field is empty. */
function syncTxnRuleControls() {
  const hasQ = !!$id('ovSearch').value.trim();
  $id('txnRuleCat').disabled = !hasQ;
  $id('txnScopeSource').disabled = !hasQ;
  $id('txnScopeAccount').disabled = !hasQ;
  $id('txnAddRuleBtn').disabled = !hasQ;
}
/* Description search — server-side, with the same matching as category
 * rules (see txnSearch* in js/ui.js): the rows shown are exactly the
 * rows a rule with the typed pattern would catch, so a pattern can be
 * tested before saving. Debounced; out-of-order responses are dropped. */
$id('ovSearch').addEventListener('input', () => {
  ovSearch = $id('ovSearch').value;
  syncTxnRuleControls();
  clearTimeout(ovSearchTimer);
  ovSearchTimer = setTimeout(loadOverrides, 200);
});

/* Save the typed keyword as a category rule — same endpoint the
 * Categories page rule form uses (POST /api/rules). The keyword is kept
 * in the search box so the table below immediately shows the new rule
 * landing on its matches (set-by badge flips to "rule"). */
async function addTxnRule(e) {
  e.preventDefault();
  const pattern = $id('ovSearch').value.trim();
  if (!pattern) return;
  const category = $id('txnRuleCat').value;
  const source = $id('txnScopeSource').value || null;
  const account = $id('txnScopeAccount').value || null;
  try {
    await api('/api/rules', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pattern, category, source, account }),
    });
    toast('Rule added' + (source || account
      ? ' (scoped: ' + [source, account].filter(Boolean).join(' · ') + ')'
      : ''));
    if (window.onDataChanged) setTimeout(onDataChanged, 400);
  } catch (err) {
    toast('Could not add rule: ' + err.message, 5000);
  }
}

async function renderAll() {
  const summary = await api('/api/summary');
  $id('emptyHint').style.display = summary.n_transactions ? 'none' : 'block';
  setPageRange(summary.first_date, summary.last_date, txnCountText(summary));

  // Merged categorization list: overrides + still-uncategorized rows.
  // Filter/search/sort state is kept; the server filters + sorts the full
  // history and returns the top window plus the true counts.
  loadOverrides();
}

(async function init() {
  renderChrome('transactions');
  const [cats, health, accounts] = await Promise.all([
    api('/api/standard-categories'),
    api('/api/health'),
    api('/api/accounts'),
  ]);
  CATS = cats;
  window.LLM_CONFIGURED = !!health.llm_configured;
  // Rule-builder row: category options (same set the Categories rule form
  // offers — Ignored has its own box there) and source/account scope from
  // the live account list. Controls start disabled (no keyword yet).
  _accountsCache = accounts;
  $id('txnRuleCat').innerHTML = CATS.filter(c => c !== 'Ignored')
    .map(c => `<option>${esc(c)}</option>`).join('');
  $id('txnScopeSource').innerHTML =
    _scopeOptions(_scopeSources(accounts), 'All sources');
  $id('txnScopeAccount').innerHTML =
    _scopeOptions(_scopeAccounts(accounts, ''), 'All accounts');
  syncTxnRuleControls();
  try {
    await renderAll();
  } catch (e) {
    toast('Failed to load: ' + e.message, 8000);
  }
})();
</script>
</body>
</html>
