<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Apply the saved color scheme (mercury.theme) before first paint
     so there is no flash of the default scheme. -->
<script>try { var _t = localStorage.getItem('mercury.theme'); if (_t) document.documentElement.dataset.theme = _t; } catch (e) {}</script>
<link rel="icon" href="/static/img/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/static/img/apple-touch-icon.png" />
<title>Mercury — Transactions</title>
<link rel="stylesheet" href="/static/css/app.css" />
<script src="/static/vendor/chart.umd.min.js"></script>
<script src="/static/js/common.js"></script>
<script src="/static/js/ui.js"></script>
</head>
<body>
<div id="site-header"></div>
<main>
  <div class="page-range" id="page-range"></div>
  <div class="panel" id="emptyHint" style="display:none;margin-bottom:24px">
    <h2 style="margin:0 0 8px;font-size:16px">No transactions yet</h2>
    <p style="color:var(--muted);margin:0">Use <b>Manage Imports</b> in the top bar to load
    your bank exports (Wells Fargo, Chase, Apple Card, US Bank) — and later to rename
    or delete any import. Files are matched by filename — keep the bank's original names.</p>
  </div>

  <section class="section">
    <div class="section-head">
      <h2>Find transactions</h2>
      <!-- Two-mode tab: Set Category (rule builder + per-row category
           select) and Match Merchant (rule builder + per-row merchant
           input). The search bar is the same in both tabs. -->
      <div class="head-right">
        <div class="seg" role="tablist" aria-label="Find transactions mode">
          <button role="tab" id="tabCat" class="active" aria-selected="true" onclick="switchTxnTab('category')">Set Category</button>
          <button role="tab" id="tabMerchant" aria-selected="false" onclick="switchTxnTab('merchant')">Match Merchant</button>
        </div>
        <span class="badge" id="ovShownCount" aria-live="polite"></span>
        <button class="primary" id="classifyBtn" onclick="runClassify()">Classify unknown (LLM)</button>
        <!-- Shared hint (ui.js txnSearchHint): empty unless a non-default
             sort direction or an extra note is active. -->
        <span class="hint" id="ovHint"></span>
      </div>
    </div>
    <!-- Monthly bar chart — its OWN panel above the search (sr1us).
         Mirrors the rows the search is showing right now. Space is
         ALWAYS reserved (fixed-height .chart-wrap — the no-jump
         contract): the panel is never hidden, an empty search/load
         shows the muted hint inside the same 320px wrap. -->
    <div class="panel" id="txnChartPanel">
      <div class="chart-wrap">
        <canvas id="txnChart"></canvas>
        <span class="chart-empty" id="txnChartEmpty">No data to chart</span>
      </div>
    </div>
    <!-- Search bar (rule-builder form) INSIDE the panel above the list —
         the same layout as the Categories rule panels, and the same bar
         code as the Month page (wireTxnSearchBar in ui.js). "Add rule"
         saves the typed keyword → category (+ scope) as a category
         rule; the keyword input is also the description search (same
         live filtering + chart). Dropdowns + button stay disabled until
         a keyword is typed. -->
    <div class="panel" id="txnPanel">
      <form class="rule-form" id="txnRuleForm" onsubmit="addTxnRule(event)">
        <!-- "Set by" sits LEFT of the search input, separated from the
             rule-builder controls by a divider (sr1us). Options come
             from TXN_SET_BY_OPTIONS (ui.js) — shared with the Month
             page. -->
        <select id="setBySel" class="setby-sel" aria-label="Filter rows by who set the category">
          <option value="all">All</option>
        </select>
        <input id="ovSearch" type="text" maxlength="200"
               placeholder="Keyword, e.g. 'walmart'"
               aria-label="Search transactions by description">
        <span class="form-sep" aria-hidden="true"></span>
        <select id="txnRuleCat" disabled aria-label="Category for the new rule"></select>
        <select id="txnScopeSource" disabled aria-label="Source scope"
                onchange="scopeSourceChanged('txn')"></select>
        <select id="txnScopeAccount" disabled aria-label="Account scope"></select>
        <button type="submit" id="txnAddRuleBtn" disabled>Add rule</button>
      </form>
      <!-- id="overrides" on the list container: renderOverrides targets
           it directly. min-height reserves the list's space before the
           fetch lands (the panel itself is no longer :empty — the form
           is a permanent child — so the .panel:empty rule can't do it). -->
      <div id="overrides" style="min-height:120px"></div>
    </div>
    <!-- Match Merchant panel: mirrors the Merchants page's Match merchants
         panel (free-form merchant rule builder + per-row merchant input).
         Same search bar + sort; hidden unless the merchant tab is active. -->
    <div class="panel" id="txnMerchantPanel" style="display:none">
      <form class="rule-form" id="txnMrRuleForm" onsubmit="addTxnMrRule(event)">
        <select id="mrSetBySel" class="setby-sel" aria-label="Filter rows by who set the merchant">
          <option value="all">All</option>
        </select>
        <input id="mrSearch" type="text" maxlength="200"
               placeholder="Keyword, e.g. 'walmart'"
               aria-label="Search transactions by description">
        <span class="form-sep" aria-hidden="true"></span>
        <input id="mrMerchant" type="text" maxlength="100" placeholder="Merchant (e.g. Walmart)"
               aria-label="Merchant for the new rule" disabled>
        <select id="mrScopeSource" disabled aria-label="Source scope"
                onchange="scopeSourceChanged('mr')"></select>
        <select id="mrScopeAccount" disabled aria-label="Account scope"></select>
        <button type="submit" id="mrAddRuleBtn" disabled>Add rule</button>
      </form>
      <div id="mrList" style="min-height:120px"></div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>
<div id="modal-root"></div>

<script>
window.onDataChanged = renderAll;
const OV_SET_BY = { manual: 'you', llm: 'LLM', rule: 'rule', csv: 'bank',
                    unknown: 'unknown', uncategorized: 'pending' };
const OV_LIMIT = 1000;        // browse-view window (no search): top 1000 of the filter
const OV_SEARCH_LIMIT = 100000; // search: pull the FULL matching set — a search that
                                // silently truncates to 1000 hides real rule matches
const OV_BASE_HINT = 'missing CSV category or re-categorized · re-pick a category to make it yours';
/* The Set-by filter, description search and column sort all run on the
 * SERVER over the full history (SQL filter + sort before LIMIT). Browse
 * (no search) shows the top OV_LIMIT rows of the section's base set; with
 * a search term active the search scans EVERY transaction — including
 * rows that only carry the bank's CSV category, which the list doesn't
 * show by default (they render with the "bank" badge) — and the limit
 * jumps to OV_SEARCH_LIMIT so every match is visible. The "X of Y shown"
 * hint below the table is the safety net if a term ever matches more. */
let ovRows = [];
let ovTotal = 0;
let ovPendingTotal = 0;
let ovFilter = 'all';
let ovSearch = '';
let ovSeq = 0;

/* Match Merchant tab: same shape as the Merchants page's Match merchants
 * panel (server-side sort/filter via /api/merchants). Both tabs share the
 * search bar and the monthly chart; only the panel + head badge/hint swap. */
let txnTab = 'category';
const MR_SET_BY = { manual: 'you', llm: 'LLM', rule: 'rule',
                    uncategorized: 'pending', unknown: 'unknown' };
const MR_SET_BY_OPTIONS = [
  ['all', 'All'],
  ['manual', 'Manual'],
  ['llm', 'LLM'],
  ['rule', 'Rule'],
  ['uncategorized', 'Uncategorized'],
];
const MR_LIMIT = 1000;          // browse-view window (no search)
const MR_SEARCH_LIMIT = 100000; // search: pull the FULL matching set
let mrRows = [];
let mrTotal = 0;
let mrPendingTotal = 0;
let mrFilter = 'all';
let mrSearch = '';
let mrSeq = 0;

function switchTxnTab(tab) {
  if (tab !== 'category' && tab !== 'merchant') return;
  txnTab = tab;
  $id('tabCat').classList.toggle('active', tab === 'category');
  $id('tabMerchant').classList.toggle('active', tab === 'merchant');
  $id('tabCat').setAttribute('aria-selected', String(tab === 'category'));
  $id('tabMerchant').setAttribute('aria-selected', String(tab === 'merchant'));
  $id('txnPanel').style.display = tab === 'category' ? '' : 'none';
  $id('txnMerchantPanel').style.display = tab === 'merchant' ? '' : 'none';
  if (tab === 'category') loadOverrides();
  else loadMerchants();
}

function ovQuery() {
  const st = $id('overrides')._sortState || { key: 'date', dir: 'desc' };
  const q = (ovSearch || '').trim();
  const p = new URLSearchParams({
    limit: String(q ? OV_SEARCH_LIMIT : OV_LIMIT),
    include_uncategorized: 'true',
    set_by: ovFilter, sort_by: st.key, sort_dir: st.dir, q: ovSearch,
  });
  return '/api/overrides?' + p.toString();
}
async function loadOverrides() {
  const seq = ++ovSeq;
  let data;
  try {
    data = await api(ovQuery());
  } catch (e) {
    if (seq === ovSeq) toast('Failed to load: ' + e.message, 8000);
    return;
  }
  if (seq !== ovSeq) return; // a newer filter/search/sort click superseded it
  ovRows = data.rows;
  ovTotal = data.total;
  ovPendingTotal = data.uncategorized;
  renderOverrides();
}

/* Monthly bar chart of the rows the search/filter is showing right now —
 * same layout as makeFlowChart's totals view: one label per month, Spend
 * and Income bars side by side. Grouped from the live row set, so it
 * always mirrors the list below; when the search returns nothing it
 * shows a muted hint inside the fixed-height wrap (panel never hidden —
 * no layout shift). */
function renderTxnChart(rows, search) {
  const canvas = $id('txnChart');
  const empty = $id('txnChartEmpty');
  const existing = Chart.getChart(canvas);
  if (existing) existing.destroy();
  if (!rows.length) {
    // The panel (and its fixed-height wrap) stays visible — no layout
    // shift while loading or when a search matches nothing; only the
    // hint inside the wrap swaps in.
    empty.textContent = (search || '').trim()
      ? 'No matching transactions'
      : 'No data to chart';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';
  // Month key -> [spend, income] over the shown rows; keys in time order.
  const months = new Map();
  for (const t of rows) {
    const k = (t.date || '').slice(0, 7);
    if (!/^\d{4}-\d{2}$/.test(k)) continue;
    const m = months.get(k) || [0, 0];
    if (t.amount < 0) m[0] += -t.amount;
    else if (t.amount > 0) m[1] += t.amount;
    months.set(k, m);
  }
  const keys = [...months.keys()].sort();
  const r2 = v => Math.round(v * 100) / 100;
  new Chart(canvas, {
    type: 'bar',
    data: {
      labels: keys.map(monthLabel),
      datasets: [
        { label: 'Spend', data: keys.map(k => r2(months.get(k)[0])),
          backgroundColor: withAlpha(cssColor('--spend'), .78),
          hoverBackgroundColor: cssColor('--spend'),
          borderRadius: 4, maxBarThickness: 38 },
        { label: 'Income', data: keys.map(k => r2(months.get(k)[1])),
          backgroundColor: withAlpha(cssColor('--income'), .85),
          hoverBackgroundColor: cssColor('--income'),
          borderRadius: 4, maxBarThickness: 38 },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top', align: 'end',
          labels: { color: cssColor('--muted'), usePointStyle: true, boxWidth: 8, boxHeight: 8 } },
        tooltip: {
          // This vendored build calls filter(item, index, dataPoints,
          // chart) — only item is used here, so the slot order is safe.
          filter: item => Number(item.raw) !== 0,
          callbacks: {
            label: c => ' ' + c.dataset.label + ': ' + fmtMoney(Number(c.raw)),
          },
        },
      },
      scales: {
        x: { ticks: { color: cssColor('--muted'), autoSkip: true,
                      maxTicksLimit: 12, maxRotation: 0 },
             grid: { display: false } },
        y: { beginAtZero: true,
             ticks: { color: cssColor('--muted'), callback: v => fmtAxis(v) },
             grid: { color: cssColor('--grid') } },
      },
    },
  });
}

function renderOverrides() {
  const el = $id('overrides');
  if (!el._sortState) el._sortState = { key: 'date', dir: 'desc' };
  const st = el._sortState;
  const rows = ovRows; // already filtered + sorted by the server
  const q = (ovSearch || '').trim();
  const qre = q ? txnSearchRegex(q) : null;
  renderTxnChart(rows, q);
  const noLlm = !window.LLM_CONFIGURED;
  $id('classifyBtn').disabled = !ovPendingTotal || noLlm;
  $id('classifyBtn').title = noLlm
    ? 'LLM not configured — set both MERCURY_LLM_ENDPOINT and MERCURY_LLM_MODEL, then restart the server' : '';
  // Shown-count moved to the badge next to the h2. The hint (ui.js
  // txnSearchHint, shared with the Month page) no longer echoes the
  // search term — while a search is active the badge already reports
  // the narrowing, so the hint carries only a non-default sort
  // direction and the LLM note (idle: the sort nudge).
  $id('ovShownCount').textContent = (ovTotal > rows.length
    ? rows.length + ' of ' + ovTotal + ' shown'
    : rows.length + ' shown');
  $id('ovHint').textContent = txnSearchHint(q, st,
    noLlm && ovPendingTotal ? 'LLM not configured, Classify is disabled' : '');
  // The base-set purpose text is no longer shown in the header; keep it as
  // a hover hint on the count line where it applies.
  $id('ovHint').title = (ovFilter === 'all' && !q) ? OV_BASE_HINT : '';
  if (!rows.length) {
    $id('overrides').innerHTML = '<p class="empty">'
      + (q
        ? `No matches for “${esc(q)}”.`
        : (ovTotal
          ? (ovFilter === 'uncategorized' ? 'All transactions categorized. 🎉'
                                          : 'No ' + (OV_SET_BY[ovFilter] || ovFilter) + ' transactions.')
          : 'No categorized or pending transactions yet.'))
      + '</p>';
    return;
  }
  $id('overrides').innerHTML = `
    <table>
      <thead><tr>
        ${txnSortTh('date', 'Date', null, st)}<th>Source</th>${txnSortTh('description', 'Description', null, st)}
        <th>Category</th><th>Set by</th>${txnSortTh('amount', 'Amount', 'num', st)}
      </tr></thead>
      <tbody>${rows.map(t => `
        <tr${t.ignored ? ' class="row-ignored"' : ''}>
          <td>${esc(t.date)}</td>
          <td>${esc(t.source)}</td>
          <td class="desc" title="${esc(t.description)}">${highlightDesc(t.description, qre)}</td>
          <td><select class="cat-select" data-id="${t.id}">${catOptions(t.category)}</select>${
            t.original_category && t.original_category !== 'Uncategorized' && t.original_category !== t.category
              ? `<span class="was-cat">was: ${esc(t.original_category)}</span>` : ''}${ruleNoteHTML(t)}</td>
          <td><span class="badge src-${esc(t.set_by)}">${esc(OV_SET_BY[t.set_by] || t.set_by)}</span></td>
          <td class="num ${t.amount < 0 ? 'neg' : 'pos'}">${fmtMoney(t.amount)}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;
  wireCategorySelects(el);
  el._detailRender = () => loadOverrides();
  wireTxnSort(el);
}

/* The rule-creation controls (category / source / account dropdowns +
 * "Add rule") only make sense with a keyword in hand, so they stay
 * disabled while the search field is empty. */
function syncTxnRuleControls() {
  const hasQ = !!$id('ovSearch').value.trim();
  $id('txnRuleCat').disabled = !hasQ;
  $id('txnScopeSource').disabled = !hasQ;
  $id('txnScopeAccount').disabled = !hasQ;
  $id('txnAddRuleBtn').disabled = !hasQ;
}
/* Shared search-bar wiring (ui.js wireTxnSearchBar — the same bar as
 * the Month page). The value IS the server's set_by parameter, so no
 * client-side re-filtering; keystrokes debounce the refetch while the
 * rule-builder controls sync on every one. */
$id('setBySel').innerHTML = TXN_SET_BY_OPTIONS.map(([v, l]) =>
  `<option value="${v}">${l}</option>`).join('');
wireTxnSearchBar($id('ovSearch'), $id('setBySel'),
  ({ q, setBy }) => {
    ovSearch = q;
    ovFilter = setBy;
    loadOverrides();
  },
  { debounceMs: 200, onInput: syncTxnRuleControls });

/* Match Merchant tab: same shared search bar wiring, its own state. */
$id('mrSetBySel').innerHTML = MR_SET_BY_OPTIONS.map(([v, l]) =>
  `<option value="${v}">${l}</option>`).join('');
wireTxnSearchBar($id('mrSearch'), $id('mrSetBySel'),
  ({ q, setBy }) => {
    mrSearch = q;
    mrFilter = setBy;
    loadMerchants();
  },
  { debounceMs: 200, onInput: syncMrRuleControls });

/* Save the typed keyword as a category rule — same endpoint the
 * Categories page rule form uses (POST /api/rules). The keyword is kept
 * in the search box so the table below immediately shows the new rule
 * landing on its matches (set-by badge flips to "rule"). */
async function addTxnRule(e) {
  e.preventDefault();
  const pattern = $id('ovSearch').value.trim();
  if (!pattern) return;
  const category = $id('txnRuleCat').value;
  const source = $id('txnScopeSource').value || null;
  const account = $id('txnScopeAccount').value || null;
  try {
    await api('/api/rules', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pattern, category, source, account }),
    });
    toast('Rule added' + (source || account
      ? ' (scoped: ' + [source, account].filter(Boolean).join(' · ') + ')'
      : ''));
    if (window.onDataChanged) setTimeout(onDataChanged, 400);
  } catch (err) {
    toast('Could not add rule: ' + err.message, 5000);
  }
}

/* ------------------------------ Match Merchant tab */
/* Mirrors the Merchants page's Match merchants panel — free-form
 * merchant rule builder + per-row merchant input. Sort/filter run
 * server-side via /api/merchants; provenance: you > rule > LLM > (nothing). */
function mrQuery() {
  const st = $id('mrList')._sortState || { key: 'date', dir: 'desc' };
  const q = (mrSearch || '').trim();
  const p = new URLSearchParams({
    limit: String(q ? MR_SEARCH_LIMIT : MR_LIMIT),
    include_uncategorized: 'true',
    set_by: mrFilter, sort_by: st.key, sort_dir: st.dir, q: mrSearch,
  });
  return '/api/merchants?' + p.toString();
}
async function loadMerchants() {
  const seq = ++mrSeq;
  let data;
  try {
    data = await api(mrQuery());
  } catch (e) {
    if (seq === mrSeq) toast('Failed to load: ' + e.message, 8000);
    return;
  }
  if (seq !== mrSeq) return;
  mrRows = data.rows;
  mrTotal = data.total;
  mrPendingTotal = data.uncategorized;
  renderMerchants();
}
function mrRuleNoteHTML(t) {
  if (!t || !t.rule_match) return '';
  const m = t.rule_match;
  const active = t.set_by === 'rule';
  const shadowed = Math.max(0, (t.rule_matches || 1) - 1);
  const who = t.set_by === 'manual' ? 'you' : t.set_by;
  const title = active
    ? `Merchant comes from rule “${m.pattern}” (first match in priority order wins).`
      + (shadowed ? ` ${shadowed} lower-priority rule${shadowed > 1 ? 's' : ''} also match${shadowed > 1 ? '' : 'es'} this description.` : '')
    : `Matches rule “${m.pattern}” → ${m.merchant}, but the ${who} merchant wins (precedence: you > rule > LLM).`;
  const extra = active
    ? (shadowed ? ` · +${shadowed} shadowed` : '')
    : ` · overridden (${who} wins)`;
  return `<span class="rule-note${active ? ' rule-note-active' : ''}" title="${esc(title)}">${esc(`rule “${m.pattern}” → ${m.merchant}`)}${extra}</span>`;
}
function renderMerchants() {
  const el = $id('mrList');
  if (!el._sortState) el._sortState = { key: 'date', dir: 'desc' };
  const st = el._sortState;
  const rows = mrRows;
  const q = (mrSearch || '').trim();
  const qre = q ? txnSearchRegex(q) : null;
  const noLlm = !window.LLM_CONFIGURED;
  renderTxnChart(rows, q);
  $id('classifyBtn').disabled = !mrPendingTotal || noLlm;
  $id('classifyBtn').title = noLlm
    ? 'LLM not configured — set both MERCURY_LLM_ENDPOINT and MERCURY_LLM_MODEL, then restart the server' : '';
  $id('ovShownCount').textContent = (mrTotal > rows.length
    ? rows.length + ' of ' + mrTotal + ' shown'
    : rows.length + ' shown');
  $id('ovHint').textContent = txnSearchHint(q, st,
    noLlm && mrPendingTotal ? 'LLM not configured, Classify is disabled' : '');
  $id('ovHint').title = '';
  if (!rows.length) {
    el.innerHTML = '<p class="empty">'
      + (q
        ? `No matches for “${esc(q)}”.`
        : (mrTotal
          ? (mrFilter === 'uncategorized' ? 'All transactions have a merchant. 🎉'
            : 'No ' + (MR_SET_BY[mrFilter] || mrFilter) + ' transactions.')
          : 'No transactions yet.'))
      + '</p>';
    return;
  }
  el.innerHTML = `
    <table>
      <thead><tr>
        ${txnSortTh('date', 'Date', null, st)}<th>Source</th>${txnSortTh('description', 'Description', null, st)}
        ${txnSortTh('merchant', 'Merchant', null, st)}<th>Set by</th>${txnSortTh('amount', 'Amount', 'num', st)}
      </tr></thead>
      <tbody>${rows.map(t => `
        <tr${t.ignored ? ' class="row-ignored"' : ''}>
          <td>${esc(t.date)}</td>
          <td>${esc(t.source)}</td>
          <td class="desc" title="${esc(t.description)}">${highlightDesc(t.description, qre)}</td>
          <td><input class="mr-input" data-id="${t.id}" value="${esc(t.merchant || '')}" placeholder="—" aria-label="Merchant for transaction ${t.id}">${mrRuleNoteHTML(t)}</td>
          <td><span class="badge src-${esc(t.set_by)}">${esc(MR_SET_BY[t.set_by] || t.set_by)}</span></td>
          <td class="num ${t.amount < 0 ? 'neg' : 'pos'}">${fmtMoney(t.amount)}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;
  wireMrInputs(el);
  el._detailRender = () => loadMerchants();
  wireTxnSort(el);
}
function wireMrInputs(root) {
  root.querySelectorAll('input.mr-input').forEach(inp => {
    inp.addEventListener('change', async () => {
      const val = inp.value.trim();
      try {
        await api('/api/merchants/overrides', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ids: [+inp.dataset.id], merchant: val || null }),
        });
        toast(val ? 'Merchant updated' : 'Merchant cleared');
        if (window.onDataChanged) setTimeout(onDataChanged, 400);
      } catch (e) {
        toast('Update failed: ' + e.message, 5000);
      }
    });
  });
}
function syncMrRuleControls() {
  const hasQ = !!$id('mrSearch').value.trim();
  $id('mrMerchant').disabled = !hasQ;
  $id('mrScopeSource').disabled = !hasQ;
  $id('mrScopeAccount').disabled = !hasQ;
  $id('mrAddRuleBtn').disabled = !hasQ;
}
async function addTxnMrRule(e) {
  e.preventDefault();
  const pattern = $id('mrSearch').value.trim();
  const merchant = $id('mrMerchant').value.trim();
  if (!pattern || !merchant) {
    toast('Type a keyword and a merchant first', 4000);
    return;
  }
  const source = $id('mrScopeSource').value || null;
  const account = $id('mrScopeAccount').value || null;
  try {
    await api('/api/merchants/rules', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pattern, merchant, source, account }),
    });
    toast('Rule added' + (source || account
      ? ' (scoped: ' + [source, account].filter(Boolean).join(' · ') + ')'
      : ''));
    if (window.onDataChanged) setTimeout(onDataChanged, 400);
  } catch (err) {
    toast('Could not add rule: ' + err.message, 5000);
  }
}

async function renderAll() {
  const summary = await api('/api/summary');
  $id('emptyHint').style.display = summary.n_transactions ? 'none' : 'block';
  setPageRange(summary.first_date, summary.last_date, txnCountText(summary));

  // Merged categorization list: overrides + still-uncategorized rows.
  // Filter/search/sort state is kept; the server filters + sorts the full
  // history and returns the top window plus the true counts. The active
  // tab (Set Category vs Match Merchant) decides which list renders.
  if (txnTab === 'merchant') loadMerchants();
  else loadOverrides();
}

/* The section-head "Classify unknown (LLM)" button dispatches to the
 * active tab: /api/classify for categories, /api/merchants/classify for
 * merchants. (ui.js defines runClassify globally; this local definition
 * wins for this page.) */
async function runClassify() {
  if (txnTab === 'merchant') {
    await withBusyButton('classifyBtn', 'Classifying…', async () => {
      toast('Classifying…');
      try {
        const res = await api('/api/merchants/classify', { method: 'POST' });
        toast(`Classified ${res.classified} (${res.skipped} skipped)`);
      } catch (e) {
        toast('Classify failed: ' + e.message, 6000);
      }
    });
    if (window.onDataChanged) setTimeout(onDataChanged, 400);
    return;
  }
  await withBusyButton('classifyBtn', 'Classifying…', async () => {
    toast('Classifying…');
    try {
      const res = await api('/api/classify', { method: 'POST' });
      toast(`Classified ${res.classified} of ${res.of}`);
    } catch (e) {
      toast('Classify failed: ' + e.message, 6000);
    }
  });
  if (window.onDataChanged) setTimeout(onDataChanged, 400);
}

(async function init() {
  renderChrome('transactions');
  const [cats, health, accounts] = await Promise.all([
    api('/api/standard-categories'),
    api('/api/health'),
    api('/api/accounts'),
  ]);
  CATS = cats;
  window.LLM_CONFIGURED = !!health.llm_configured;
  // Rule-builder row: category options (same set the Categories rule form
  // offers — Ignored has its own box there) and source/account scope from
  // the live account list. Controls start disabled (no keyword yet).
  _accountsCache = accounts;
  $id('txnRuleCat').innerHTML = CATS.filter(c => c !== 'Ignored')
    .map(c => `<option>${esc(c)}</option>`).join('');
  $id('txnScopeSource').innerHTML =
    _scopeOptions(_scopeSources(accounts), 'All sources');
  $id('txnScopeAccount').innerHTML =
    _scopeOptions(_scopeAccounts(accounts, ''), 'All accounts');
  syncTxnRuleControls();
  // Match Merchant tab: scope dropdowns from the same account list.
  $id('mrScopeSource').innerHTML =
    _scopeOptions(_scopeSources(accounts), 'All sources');
  $id('mrScopeAccount').innerHTML =
    _scopeOptions(_scopeAccounts(accounts, ''), 'All accounts');
  syncMrRuleControls();
  try {
    await renderAll();
  } catch (e) {
    toast('Failed to load: ' + e.message, 8000);
  }
})();
</script>
</body>
</html>
