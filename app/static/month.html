<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Apply the saved color scheme (mercury.theme) before first paint
     so there is no flash of the default scheme. -->
<script>try { var _t = localStorage.getItem('mercury.theme'); if (_t) document.documentElement.dataset.theme = _t; } catch (e) {}</script>
<link rel="icon" href="/static/img/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/static/img/apple-touch-icon.png" />
<title>Mercury — Month</title>
<link rel="stylesheet" href="/static/css/app.css" />
<script src="/static/vendor/chart.umd.min.js"></script>
<script src="/static/js/common.js"></script>
<script src="/static/js/ui.js"></script>
</head>
<body>
<div id="site-header"></div>
<main>
  <div class="page-range" id="page-range"></div>
  <section class="section">
    <div class="toolbar">
      <label for="monthSel">Month</label>
      <select id="monthSel"></select>
      <span class="spacer"></span>
      <a href="/" style="color:var(--muted);font-size:13px">← back to overview</a>
    </div>
  </section>

  <div class="panel" id="emptyHint" style="display:none;margin-bottom:24px">
    <h2 style="margin:0 0 8px;font-size:16px">No transactions yet</h2>
    <p style="color:var(--muted);margin:0">Import bank CSVs from the top bar, then come back here.</p>
  </div>

  <section class="section">
    <div class="cards" id="monthCards"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>Weekly cash flow</h2>
      <div class="seg" id="flowSeg" data-key="month" role="group" aria-label="Chart view">
        <button type="button" data-mode="category">By category</button>
        <button type="button" data-mode="totals">Totals</button>
      </div>
      <span class="hint" id="chartHint"></span>
    </div>
    <div class="panel"><div class="chart-wrap"><canvas id="flowChart"></canvas></div></div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>Spend by category</h2>
      <span class="hint">this month · click a row to drill down</span>
    </div>
    <div class="panel tight" id="catTable"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>All transactions</h2>
      <span class="badge" id="txnCount"></span>
      <!-- Shared hint (ui.js txnSearchHint — same as the Transactions
           page): idle -> sort nudge; while a search is active the
           badge already reports the narrowing, so the hint stays
           empty (non-default sort direction still shown). -->
      <span class="hint" id="txnHint">click a column to sort</span>
    </div>
    <!-- Same search bar as the Transactions page: one form inside the
         panel above the table (the Categories rule-panel layout), shared
         options + wiring in ui.js (wireTxnSearchBar / TXN_SET_BY_OPTIONS).
         The data path stays client-side — the month window is fetched
         once and the bar filters it here. -->
    <div class="panel" id="txnPanel">
      <form class="rule-form" onsubmit="return false">
        <input id="txnSearch" type="text" maxlength="200"
               placeholder="Keyword, e.g. 'walmart'"
               aria-label="Search transactions by description">
        <select id="setBySel" class="setby-sel" aria-label="Filter rows by who set the category">
          <!-- Options populated from TXN_SET_BY_OPTIONS (ui.js) at load —
               one source of truth shared with the Transactions page. -->
          <option value="all">All</option>
        </select>
      </form>
      <!-- min-height reserves the list's space before the fetch lands
           (the panel itself is no longer :empty — the form is a
           permanent child — so the .panel:empty rule can't do it). -->
      <div id="txnTable" style="min-height:120px"></div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>
<div id="modal-root"></div>

<script>
let curMonth = '';
let _flowCfg = null; // last chart config, so the view toggle re-draws
                     // without refetching

window.onDataChanged = () => renderMonth(curMonth);

/* Description search + "Set by" dropdown on the "All transactions"
 * table — the SAME bar as the Transactions page (shared options, wiring
 * and hint logic in ui.js). Search matching is the category-rule
 * semantics (case-insensitive partial substring on whitespace-normalized
 * text), so the visible rows are exactly the rows a rule with the typed
 * pattern would catch. The Set-by filter narrows by who set the row's
 * effective category (txnSetByMatch) — same vocabulary as the "Set by"
 * column. Shown-count lives in the badge next to the h2; the hint only
 * carries the non-default sort direction (idle: the sort nudge). */
function updateTxnChrome() {
  const table = $id('txnTable');
  const q = ($id('txnSearch').value || '').trim();
  const by = $id('setBySel').value || 'all';
  $id('txnCount').textContent = (q || by !== 'all')
    ? (table._lastShown ?? 0) + ' of ' + (table._lastTotal ?? 0) + ' shown'
    : (table._lastTotal ?? 0) + ' transactions';
  $id('txnHint').textContent = txnSearchHint(q, table._sortState);
}

/* Shared bar wiring (ui.js wireTxnSearchBar — same as the Transactions
 * page). Client-side: the month window is already loaded, so no debounce;
 * the table re-renders directly. _detailRender routes header-sort clicks
 * through the chrome update too, so the hint tracks the sort state. */
$id('setBySel').innerHTML = TXN_SET_BY_OPTIONS.map(([v, l]) =>
  `<option value="${v}">${l}</option>`).join('');
wireTxnSearchBar($id('txnSearch'), $id('setBySel'),
  ({ q, setBy }) => {
    const table = $id('txnTable');
    table._search = q;
    table._setBy = setBy;
    renderTxnTable(table);
    updateTxnChrome();
  });
$id('txnTable')._detailRender = () => {
  renderTxnTable($id('txnTable'));
  updateTxnChrome();
};

/* Calendar weeks (Mon–Sun) overlapping the month, clipped to it.
 * Returns [{week: 'YYYY-MM-DD' (Monday), label: 'Sep 1–7', ...}]. */
function monthWeeks(month) {
  const [y, m] = month.split('-').map(Number);
  const first = Date.UTC(y, m - 1, 1);
  const last = Date.UTC(y, m, 0); // 0th of next month = last day of m
  let start = first;
  start -= ((new Date(first).getUTCDay() + 6) % 7) * 86400000; // back to Monday
  const out = [];
  const f = ms => { const d = new Date(ms); return MONTHS_SHORT[d.getUTCMonth()] + ' ' + d.getUTCDate(); };
  while (start <= last) {
    const end = start + 6 * 86400000;
    const a = Math.max(start, first);
    const b = Math.min(end, last);
    out.push({ week: new Date(start).toISOString().slice(0, 10),
               label: a === b ? f(a) : f(a) + '–' + f(b) });
    start += 7 * 86400000;
  }
  return out;
}

async function renderMonth(month) {
  curMonth = month;
  const [weeklyRes, cats, txns, sum] = await Promise.all([
    api('/api/weekly?month=' + encodeURIComponent(month) + '&by_category=true'),
    api('/api/categories?month=' + encodeURIComponent(month)),
    api('/api/transactions?month=' + encodeURIComponent(month) + '&limit=5000'),
    api('/api/summary?month=' + encodeURIComponent(month)),
  ]);
  const weekly = weeklyRes.weeks;

  // Summary cards from the complete weekly aggregates.
  const income = weekly.reduce((a, w) => a + w.income, 0);
  const spend = weekly.reduce((a, w) => a + w.spend, 0);
  const net = income - spend;
  const rate = income > 0 ? (net / income * 100).toFixed(1) + '%' : '—';
  $id('monthCards').innerHTML = [
    ['Income', fmtMoney(income), 'income'],
    ['Spent', fmtMoney(spend), 'spend'],
    ['Net', fmtMoney(net), net >= 0 ? 'income' : 'spend'],
    ['Savings rate', rate, ''],
  ].map(([l, v, c]) =>
    `<div class="card"><div class="label">${l} · ${monthLong(month)}</div><div class="value ${c}">${v}</div></div>`).join('');

  // Weekly chart: merge calendar buckets with the API rows.
  const weeks = monthWeeks(month);
  const byWeek = Object.fromEntries(weekly.map(w => [w.week, w]));
  makeFlowChart($id('flowChart'), _flowCfg = {
    labels: weeks.map(w => w.label),
    keys: weeks.map(w => w.week),
    spend: weeks.map(w => (byWeek[w.week] || {}).spend || 0),
    income: weeks.map(w => (byWeek[w.week] || {}).income || 0),
    byCategory: (weeklyRes.flow_by_category || []).map(r =>
      ({ key: r.bucket, category: r.category,
         spend: r.spend, income: r.income })),
    modeKey: 'month',
  });
  $id('chartHint').textContent = `${monthLong(month)} · Mon–Sun weeks, clipped to the month`;

  renderCategoryTable($id('catTable'), cats, { month });

  mountTxnTable($id('txnTable'), txns);
  updateTxnChrome();
  setPageRange(sum.first_date, sum.last_date, txnCountText(sum, 'no transactions in ' + monthLong(month)));
}

(async function init() {
  renderChrome('month');
  // Reserve the cards section height before the fetch so the page
  // doesn't jump when the data lands (renderMonthCards replaces them).
  $id('monthCards').innerHTML = skelCards(4, 'value');
  CATS = await api('/api/standard-categories');
  wireFlowToggle('flowSeg',
    () => { if (_flowCfg) makeFlowChart($id('flowChart'), _flowCfg); });
  const periods = await api('/api/periods');
  if (!periods.months.length) {
    // No data: swap the skeletons for a compact note (emptyHint explains),
    // and drop the whole "Weekly cash flow" section so the fixed-height
    // .chart-wrap doesn't leave 320px of dead space.
    $id('monthCards').innerHTML = '<p class="empty">No data yet.</p>';
    $id('emptyHint').style.display = 'block';
    $id('flowChart').closest('section').style.display = 'none';
    return;
  }
  const sel = $id('monthSel');
  // Newest first.
  sel.innerHTML = periods.months.slice().reverse()
    .map(m => `<option value="${m}">${monthLabel(m)}</option>`).join('');
  const requested = getParam('month');
  sel.value = requested && periods.months.includes(requested)
    ? requested : periods.months[periods.months.length - 1];
  sel.onchange = () => location.href = '/month?month=' + sel.value;
  try {
    await renderMonth(sel.value);
  } catch (e) {
    toast('Failed to load: ' + e.message, 8000);
  }
})();
</script>
</body>
</html>
