[project]
name = "mercury"
version = "0.1.0"
description = "Local family finance dashboard: FastAPI + DuckDB. Runs on localhost, no cloud."
requires-python = ">=3.12"
dependencies = [
    "duckdb==2.0.0",
    "fastapi==0.163.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "python-multipart>=0.0.33",
]

[tool.uv]
# Run as `python -m app.main` from the repo root; do not install the app as a package.
package = false
